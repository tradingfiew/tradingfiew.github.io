name: Android native launch crash smoke test
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-crash-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-native-start:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Compile native debug app
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Install and launch on Android emulator (capture crash log)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            set -e
            mkdir -p android-smoke
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep -E '(chrome|tradingfiew)' | tee android-smoke/packages.txt || true
            adb logcat -c
            adb shell am start -W -n com.ribhlab.tradingfiew.debug/com.ribhlab.tradingfiew.LauncherActivity > android-smoke/activity-start.txt 2>&1 || true
            sleep 12
            # TWA calendar transition must not crash even if no ad is loaded.
            # Runner executes every line separately, so keep the full intent
            # on ONE line (backslash continuation caused an illegal '-a' command).
            adb shell am start -W -n com.ribhlab.tradingfiew.debug/com.ribhlab.tradingfiew.NaturalTransitionActivity -a android.intent.action.VIEW -d 'tradingfiew://open-calendar' > android-smoke/calendar-start.txt 2>&1 || true
            sleep 5
            adb logcat -d -v time > android-smoke/logcat.txt
            adb shell dumpsys activity activities > android-smoke/activities.txt
            grep -n -A 65 -B 8 'FATAL EXCEPTION' android-smoke/logcat.txt | head -150 > android-smoke/crash-excerpt.txt || true
            cat android-smoke/activity-start.txt
            cat android-smoke/crash-excerpt.txt
            if grep -q 'FATAL EXCEPTION' android-smoke/crash-excerpt.txt; then
              echo "::error::Android app crashed at launch. Inspect logcat artifact."
              exit 1
            fi
            if grep -Eq 'Error type 3|Exception|Activity class .* does not exist' android-smoke/activity-start.txt android-smoke/calendar-start.txt; then
              echo "::error::Android activity could not start."
              exit 1
            fi
            echo "TradingFiew DEBUG launched without a detected native crash; calendar interstitial tested with Google TEST IDs only."
      - name: Upload logs and activity state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TradingFiew-Android-Crash-Logs
          if-no-files-found: warn
          retention-days: 7
          path: android-smoke/
