name: TradingFiew Android 1.0.2 startup QA on emulator API 30
on:
  push:
    paths:
      - '.github/workflows/android-startup-qa-v2.yml'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/java/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed 1.0.2 release APK
        run: |
          curl --fail --location --retry 3 -o tradingfiew-release.apk https://github.com/univcours/ribhlab/releases/download/tradingfiew-android-v1.0.2-rivo-key/TradingFiew-Android-1.0.2-RivoScanKey-SIGNED.apk
          echo '6da15380df94ed59da564690846c8e03e46e4b12d0d4895b5980fe22110ebda2  tradingfiew-release.apk' | sha256sum --check
      - name: Enable emulator acceleration for the runner
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Boot small Android API30 emulator and validate launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          disable-animations: false
          emulator-boot-timeout: 1100
          script: |
            set -eu
            mkdir -p android-startup-v2
            adb wait-for-device
            adb shell getprop sys.boot_completed | tee android-startup-v2/boot.txt
            adb install -r tradingfiew-release.apk
            adb shell pm list packages | grep -E 'chrome|tradingfiew' > android-startup-v2/packages.txt || true
            adb shell am set-debug-app --persistent com.android.chrome
            adb shell 'echo "chrome --disable-fre --no-first-run" > /data/local/tmp/chrome-command-line'
            adb logcat -c
            adb shell am start -W -n com.ribhlab.tradingfiew/com.ribhlab.tradingfiew.LauncherActivity 2>&1 | tee android-startup-v2/activity.txt
            sleep 10
            adb logcat -d -v time > android-startup-v2/logcat.txt
            adb shell dumpsys activity activities > android-startup-v2/activities.txt
            grep -n -B 5 -A 50 -E 'FATAL EXCEPTION|Caused by:|Process: com.ribhlab.tradingfiew' android-startup-v2/logcat.txt > android-startup-v2/crash-check.txt || true
            adb shell uiautomator dump /sdcard/tradingfiew.xml
            adb pull /sdcard/tradingfiew.xml android-startup-v2/ui.xml
            adb exec-out screencap -p > android-startup-v2/screen.png
            cat android-startup-v2/activity.txt
            grep -Ei 'watchlist|timeframe|TradingFiew|candlestick' android-startup-v2/ui.xml >/dev/null
            ! grep -q 'FirstRunActivity' android-startup-v2/activities.txt || ! grep -E 'mResumedActivity:.*FirstRunActivity' android-startup-v2/activities.txt
            test "$(grep -c 'FATAL EXCEPTION' android-startup-v2/logcat.txt)" -eq 0
            grep -q 'Status: ok' android-startup-v2/activity.txt
            echo 'ANDROID_LAUNCHER_SUCCESS_NO_FATAL_MAIN_PROCESS' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TradingFiew-Android-1.0.2-emulator-startup-logcat
          path: android-startup-v2/
          if-no-files-found: warn
          retention-days: 10
