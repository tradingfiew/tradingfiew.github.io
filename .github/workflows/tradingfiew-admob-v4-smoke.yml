name: TradingFiew 1.0.3 AdMob TEST-ads native startup and calendar smoke
on:
  push:
    paths:
      - '.github/workflows/tradingfiew-admob-v4-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Compile DEBUG app with official Google AdMob TEST IDs
        run: |
          set -eu
          gradle --no-daemon -p android :app:assembleDebug
      - name: KVM acceleration
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Install and launch DEBUG TWA and native calendar transition
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -eu
            mkdir -p android-admob-smoke
            adb wait-for-device
            adb shell getprop sys.boot_completed | tee android-admob-smoke/boot.txt
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm list packages | grep -F 'com.ribhlab.tradingfiew.debug' | tee android-admob-smoke/packages.txt
            adb logcat -c
            adb shell am start -W -n com.ribhlab.tradingfiew.debug/com.ribhlab.tradingfiew.LauncherActivity > android-admob-smoke/launcher.txt 2>&1
            sleep 12
            adb shell am start -W -a android.intent.action.VIEW -d 'tradingfiew://open-calendar' -n com.ribhlab.tradingfiew.debug/com.ribhlab.tradingfiew.NaturalTransitionActivity > android-admob-smoke/calendar.txt 2>&1
            sleep 5
            adb logcat -d -v time > android-admob-smoke/logcat.txt
            adb shell dumpsys activity activities > android-admob-smoke/activities.txt
            adb shell uiautomator dump /sdcard/tradingfiew-smoke.xml || true
            adb pull /sdcard/tradingfiew-smoke.xml android-admob-smoke/ui.xml || true
            adb exec-out screencap -p > android-admob-smoke/screen.png || true
            cat android-admob-smoke/launcher.txt
            cat android-admob-smoke/calendar.txt
            grep -q 'Status: ok' android-admob-smoke/launcher.txt
            grep -q 'Status: ok' android-admob-smoke/calendar.txt
            if grep -A 15 'FATAL EXCEPTION' android-admob-smoke/logcat.txt | grep -Eq 'com\\.ribhlab\\.tradingfiew|TradingFiew'; then echo 'Fatal TradingFiew exception'; exit 1; fi
            echo 'TradingFiew 1.0.3 DEBUG (Google test ad IDs): launcher and calendar activities started without app fatal exception' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: TradingFiew-1.0.3-AdMob-TEST-Ads-Android-Startup-Logs
          path: android-admob-smoke/
          retention-days: 10
          if-no-files-found: warn
