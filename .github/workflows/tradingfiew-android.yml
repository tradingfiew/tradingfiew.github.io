name: TradingFiew Android (API 36)
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/tradingfiew-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 using runner SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Configure signing (GitHub secrets only)
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TRADINGFIEW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TRADINGFIEW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRADINGFIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRADINGFIEW_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tradingfiew-upload.p12"
            chmod 600 "$RUNNER_TEMP/tradingfiew-upload.p12"
            echo "TRADINGFIEW_KEYSTORE_PATH=$RUNNER_TEMP/tradingfiew-upload.p12" >> "$GITHUB_ENV"
            echo "TRADINGFIEW_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TRADINGFIEW_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TRADINGFIEW_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets missing: outputs are UNSIGNED and NOT ready to submit to Google Play."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK and Android App Bundle
        run: gradle --no-daemon -p android :app:assembleRelease :app:bundleRelease
      - name: Generate checksums
        run: |
          cd android/app/build/outputs
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TradingFiew-Android-${{ steps.signing.outputs.signed == 'true' && 'SIGNED' || 'UNSIGNED' }}
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/SHA256SUMS.txt
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tradingfiew-upload.p12"
