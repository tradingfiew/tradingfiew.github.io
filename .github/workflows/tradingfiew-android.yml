name: TradingFiew Android (API 36)
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/tradingfiew-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 using runner SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "Missing Android SDK command-line tools"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Configure signing (GitHub secrets only)
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TRADINGFIEW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TRADINGFIEW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRADINGFIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRADINGFIEW_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tradingfiew-upload.p12"
            chmod 600 "$RUNNER_TEMP/tradingfiew-upload.p12"
            echo "TRADINGFIEW_KEYSTORE_PATH=$RUNNER_TEMP/tradingfiew-upload.p12" >> "$GITHUB_ENV"
            echo "TRADINGFIEW_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "TRADINGFIEW_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "TRADINGFIEW_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets missing: outputs are UNSIGNED and NOT ready to submit to Google Play."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build DEBUG using official AdMob TEST IDs
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Upload debug APK for Android QA
        uses: actions/upload-artifact@v4
        with:
          name: TradingFiew-Android-1.0.3-DEBUG-AdMobTest
          if-no-files-found: error
          retention-days: 14
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Build release ONLY if real TradingFiew AdMob ID and signing keys exist
        if: steps.signing.outputs.signed == 'true'
        env:
          TRADINGFIEW_ADMOB_APP_ID: ${{ secrets.TRADINGFIEW_ADMOB_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TRADINGFIEW_ADMOB_APP_ID" =~ ^ca-app-pub-7945572016731367~[0-9]{10}$ ]]; then
            echo "::error::Missing or invalid TradingFiew AdMob App ID. No release output until its real ID is provided."
            exit 1
          fi
          gradle --no-daemon -p android :app:assembleRelease :app:bundleRelease
      - name: Generate release checksums
        if: steps.signing.outputs.signed == 'true'
        run: |
          cd android/app/build/outputs
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload verified signed release build artifacts
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TradingFiew-Android-1.0.3-SIGNED
          if-no-files-found: error
          retention-days: 30
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/SHA256SUMS.txt
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tradingfiew-upload.p12"
