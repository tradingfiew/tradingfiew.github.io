name: TradingFiew code and market-data regression checks
on:
  push:
    paths:
      - '*.js'
      - 'android/**'
      - '*.html'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/tradingfiew-quality.yml'
  pull_request:
    paths:
      - '*.js'
      - 'android/**'
      - '*.html'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/tradingfiew-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Validate scripts, market data, charts and mobile ads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: node --test tests/*.test.cjs
      - name: Validate native Android startup configuration
        run: python3 -m unittest discover -s tests -p 'test_android_twa_config.py' -v
