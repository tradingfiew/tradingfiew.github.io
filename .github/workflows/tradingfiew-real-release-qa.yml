name: TradingFiew signed RELEASE startup — verify real chart not Chrome welcome
on:
  push:
    paths:
      - '.github/workflows/tradingfiew-real-release-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download the real signed TradingFiew 1.0.3 release
        run: |
          set -euo pipefail
          RELEASE=https://github.com/univcours/ribhlab/releases/download/tradingfiew-android-v1.0.3-admob-rivo-key
          mkdir -p release-smoke
          curl -fL --retry 3 "$RELEASE/TradingFiew-Android-1.0.3-RivoScanKey-SIGNED.apk" -o release-smoke/tradingfiew-release.apk
          curl -fL --retry 3 "$RELEASE/SHA256SUMS.txt" -o release-smoke/SHA256SUMS.txt
          (cd release-smoke && sed -E 's#([^ /]*TradingFiew-Android-1.0.3-RivoScanKey-SIGNED.apk)#tradingfiew-release.apk#' SHA256SUMS.txt | grep 'tradingfiew-release.apk' | sha256sum --check -)
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$AAPT" dump badging release-smoke/tradingfiew-release.apk | grep -F "name='com.ribhlab.tradingfiew' versionCode='4' versionName='1.0.3'"
          "$APKSIGNER" verify --verbose release-smoke/tradingfiew-release.apk
      - name: Enable hardware virtualization
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Boot Android + complete Chrome first-run + verify signed app loads real chart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/android-real-release-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TradingFiew-REAL-SIGNED-Release-Startup-Evidence
          path: release-smoke/
          if-no-files-found: warn
          retention-days: 10
