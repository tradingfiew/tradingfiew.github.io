plugins {
    id 'com.android.application'
}

def signedBuild = [
    'TRADINGFIEW_KEYSTORE_PATH',
    'TRADINGFIEW_STORE_PASSWORD',
    'TRADINGFIEW_KEY_ALIAS',
    'TRADINGFIEW_KEY_PASSWORD'
].every { System.getenv(it)?.trim() }

// The screenshot provides the Interstitial AD UNIT ID, not the AdMob APP ID.
// Never sign/publish a release using Google's sample APP ID.
// GitHub Actions must inject the real TradingFiew App ID through a protected secret.
def admobAppId = (System.getenv('TRADINGFIEW_ADMOB_APP_ID') ?: '').trim()
def admobAppIdValid = (admobAppId ==~ /^ca-app-pub-7945572016731367~[0-9]{10}$/)
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().matches('.*(assemblerelease|bundlerelease|publishrelease|installrelease|packagerelease).*') }
if (releaseRequested && !admobAppIdValid) {
    throw new GradleException('TradingFiew AdMob App ID is missing or invalid: set secret TRADINGFIEW_ADMOB_APP_ID (ca-app-pub-7945572016731367~XXXXXXXXXX). Refusing unsafe signed release.')
}
def debugAdmobAppId = 'ca-app-pub-3940256099942544~3347511713'

android {
    namespace = 'com.ribhlab.tradingfiew'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.ribhlab.tradingfiew'
        minSdk = 24
        targetSdk = 36
        versionCode = 8
        versionName = '1.0.7'
        manifestPlaceholders = [admobAppId: admobAppIdValid ? admobAppId : debugAdmobAppId]
    }

    buildFeatures { buildConfig = true }

    if (signedBuild) {
        signingConfigs {
            release {
                storeFile = file(System.getenv('TRADINGFIEW_KEYSTORE_PATH'))
                storePassword = System.getenv('TRADINGFIEW_STORE_PASSWORD')
                keyAlias = System.getenv('TRADINGFIEW_KEY_ALIAS')
                keyPassword = System.getenv('TRADINGFIEW_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_UNIT_ID', '\"ca-app-pub-7945572016731367/2464542387\"'
            // Google Play DEX optimization: run R8 on every production release.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signedBuild) {
                signingConfig = signingConfigs.release
            }
        }
        // Production-equivalent R8 checks with TEST ads, separate debug-signed ID.
        // Never upload this QA variant to Google Play.
        r8Qa {
            initWith release
            applicationIdSuffix = '.r8qa'
            versionNameSuffix = '-r8qa'
            signingConfig = signingConfigs.debug
            manifestPlaceholders = [admobAppId: debugAdmobAppId]
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_UNIT_ID', '\"ca-app-pub-3940256099942544/1033173712\"'
            matchingFallbacks = ['release']
        }
        debug {
            // Never request real AdMob ads from test APKs.
            manifestPlaceholders = [admobAppId: debugAdmobAppId]
            buildConfigField 'String', 'ADMOB_INTERSTITIAL_UNIT_ID', '\"ca-app-pub-3940256099942544/1033173712\"'
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    implementation 'androidx.browser:browser:1.10.0'
    // Interstitial only: NO BannerAdView / AdView / AppOpenAd usage.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
