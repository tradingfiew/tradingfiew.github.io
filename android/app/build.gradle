plugins {
    id 'com.android.application'
}

def signedBuild = [
    'TRADINGFIEW_KEYSTORE_PATH',
    'TRADINGFIEW_STORE_PASSWORD',
    'TRADINGFIEW_KEY_ALIAS',
    'TRADINGFIEW_KEY_PASSWORD'
].every { System.getenv(it)?.trim() }

android {
    namespace 'com.ribhlab.tradingfiew'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ribhlab.tradingfiew'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.0'
    }

    if (signedBuild) {
        signingConfigs {
            release {
                storeFile file(System.getenv('TRADINGFIEW_KEYSTORE_PATH'))
                storePassword System.getenv('TRADINGFIEW_STORE_PASSWORD')
                keyAlias System.getenv('TRADINGFIEW_KEY_ALIAS')
                keyPassword System.getenv('TRADINGFIEW_KEY_PASSWORD')
            }
        }
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            manifestPlaceholders = [admobAppId: 'ca-app-pub-7945572016731367~1161939707']
            buildConfigField 'String', 'BANNER_ID', '"ca-app-pub-7945572016731367/9838506070"'
            buildConfigField 'String', 'INTERSTITIAL_ID', '"ca-app-pub-7945572016731367/8117339646"'
            minifyEnabled false
            if (signedBuild) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'BANNER_ID', '"ca-app-pub-3940256099942544/6300978111"'
            buildConfigField 'String', 'INTERSTITIAL_ID', '"ca-app-pub-3940256099942544/1033173712"'
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
